<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Deficit Tracker v4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0f;--bg1:#13131a;--bg2:#1c1c26;--bg3:#242432;
  --border:#2e2e40;--text:#f0f0f8;--muted:#9090b0;--dim:#555570;
  --green:#3ddc84;--yellow:#f5c542;--red:#ff6b6b;--gold:#f5c542;--blue:#6eb5ff;--purple:#b088f9;
  --row-border:#1e1e2a;--btn-e-bg:#252535;--btn-d-bg:#2a0818;
  --input-bg:#13131a;--streak-bg:#1a1a0a;--streak-border:#3a3800;
  --label-color:#6060a0;--nav-inactive:#44445a;
  --grad-a:linear-gradient(135deg,#0d0d1a 0%,#1a0d2e 100%);
  --grad-b:linear-gradient(135deg,#0a0f1a 0%,#0d1a2e 100%);
  --accent1:#b088f9;--accent2:#6eb5ff;
}
body.light,html.light{
  --bg:#f4f2f8;--bg1:#fff;--bg2:#eceaf4;--bg3:#e0ddf0;
  --border:#d0ccee;--text:#12121e;--muted:#44445a;--dim:#888;
  --green:#16a34a;--yellow:#ca8a04;--red:#dc2626;--gold:#b45309;--purple:#7c3aed;--blue:#2563eb;
  --row-border:#e8e6f4;--btn-e-bg:#e8e6f4;--btn-d-bg:#fde8e8;
  --input-bg:#f4f2f8;--streak-bg:#fef3c7;--streak-border:#fbbf24;
  --label-color:#8888aa;--nav-inactive:#aaaacc;
  --grad-a:linear-gradient(135deg,#f0eeff 0%,#e8f0ff 100%);
  --grad-b:linear-gradient(135deg,#f0f8ff 0%,#f8f0ff 100%);
  --accent1:#7c3aed;--accent2:#2563eb;
}
html,body{height:100%;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;font-family:'DM Sans',sans-serif;}
.mono{font-family:'DM Mono',monospace;}

/* GRADIENT BG */
.grad-bg{
  position:fixed;inset:0;z-index:-1;
  background:var(--bg);
  pointer-events:none;
}
.grad-bg::before{
  content:'';position:absolute;
  width:320px;height:320px;border-radius:50%;
  top:-60px;right:-80px;
  background:radial-gradient(circle,rgba(176,136,249,0.12) 0%,transparent 70%);
  animation:drift1 8s ease-in-out infinite alternate;
}
.grad-bg::after{
  content:'';position:absolute;
  width:280px;height:280px;border-radius:50%;
  bottom:100px;left:-60px;
  background:radial-gradient(circle,rgba(110,181,255,0.10) 0%,transparent 70%);
  animation:drift2 10s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate(0,0);}to{transform:translate(30px,20px);}}
@keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-20px,30px);}}

/* TOPBAR */
.topbar{padding:max(env(safe-area-inset-top),20px) 20px 14px;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;position:sticky;top:0;z-index:50;}
body.light .topbar{background:rgba(244,242,248,0.88);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;}
.topbar-sub{font-size:9px;letter-spacing:3px;color:var(--label-color);font-family:'DM Mono',monospace;margin-bottom:2px;}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-0.8px;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.vtag{font-size:8px;letter-spacing:1px;color:var(--label-color);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:2px 6px;margin-left:6px;font-family:'DM Mono',monospace;vertical-align:middle;-webkit-text-fill-color:var(--label-color);}
.pts-badge{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;}
.pts-num{color:var(--gold);font-weight:600;font-size:14px;}
.theme-btn{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 11px;font-size:14px;cursor:pointer;}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px 20px 90px;-webkit-overflow-scrolling:touch;}
.sec-head{font-size:9px;letter-spacing:3px;color:var(--label-color);margin-bottom:12px;font-family:'DM Mono',monospace;}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:rgba(10,10,15,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding-bottom:max(env(safe-area-inset-bottom),6px);z-index:100;}
body.light .nav{background:rgba(244,242,248,0.92);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 4px;background:none;border:none;color:var(--nav-inactive);font-size:7px;letter-spacing:1px;font-family:'DM Mono',monospace;cursor:pointer;transition:color 0.2s;}
.nav-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn.active{color:var(--text);}

/* STAT CARDS */
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:14px 12px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:-20px;right:-20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(176,136,249,0.08),transparent);pointer-events:none;}
.clabel{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:5px;font-family:'DM Mono',monospace;}
.cval{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.cunit{font-size:10px;color:var(--label-color);margin-left:2px;font-weight:400;}

.green{color:var(--green);}
.yellow{color:var(--yellow);}
.red{color:var(--red);}
.gold{color:var(--gold);}
.purple{color:var(--purple);}
.blue{color:var(--blue);}

/* STREAK */
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:var(--streak-bg);border:1px solid var(--streak-border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--gold);margin-bottom:16px;font-family:'DM Mono',monospace;}

/* WEEKLY REPORT */
.report-card{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:18px;overflow:hidden;position:relative;}
.report-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(176,136,249,0.07),transparent);pointer-events:none;}
.quote-track{overflow:hidden;height:20px;margin-bottom:14px;position:relative;width:100%;}
.quote-inner{display:inline-block;white-space:nowrap;padding-left:100%;animation:scroll-q 45s linear infinite;}
@keyframes scroll-q{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.quote-text{font-size:9px;letter-spacing:0.5px;color:var(--accent1);font-style:italic;font-family:'DM Sans',sans-serif;}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.rc-title{font-size:14px;font-weight:600;letter-spacing:-0.3px;}
.rc-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.rc-grade{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid;flex-shrink:0;font-family:'DM Mono',monospace;}
.rc-grade.A{background:rgba(61,220,132,0.1);color:var(--green);border-color:var(--green);}
.rc-grade.B{background:rgba(245,197,66,0.1);color:var(--yellow);border-color:var(--yellow);}
.rc-grade.C{background:rgba(249,115,22,0.1);color:#f97316;border-color:#f97316;}
.rc-grade.D{background:rgba(255,107,107,0.1);color:var(--red);border-color:var(--red);}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rc-stat{background:var(--bg2);border-radius:12px;padding:12px;}
.rsl{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:4px;font-family:'DM Mono',monospace;}
.rsv{font-size:20px;font-weight:700;letter-spacing:-0.5px;}

/* TABLE */
.tbl{background:var(--bg1);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.tbl-head{display:grid;grid-template-columns:40px 56px 56px 72px 62px 58px 40px;padding:10px 14px;border-bottom:1px solid var(--border);gap:4px;}
.tbl-head span{font-size:7px;letter-spacing:1px;color:var(--label-color);font-family:'DM Mono',monospace;}
.tbl-row{display:grid;grid-template-columns:40px 56px 56px 72px 62px 58px 40px;padding:12px 14px;border-bottom:1px solid var(--row-border);align-items:center;gap:4px;}
.tbl-row:last-child{border-bottom:none;}
.tbl-row .dt{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;}
.tbl-row .nm{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.tbl-row .df{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;}
.tbl-row .pr{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;}
.tbl-row .wo{font-size:8px;font-weight:500;color:var(--muted);letter-spacing:0.3px;}
.tbl-row .px{font-size:10px;font-weight:600;color:var(--gold);font-family:'DM Mono',monospace;}
.tbl-acts{display:flex;gap:4px;}
.btn-e,.btn-d{width:22px;height:22px;border:none;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-e{background:var(--btn-e-bg);color:var(--muted);}
.btn-d{background:var(--btn-d-bg);color:var(--red);}

/* LEGEND */
.legend{display:flex;gap:14px;font-size:9px;color:var(--muted);margin-bottom:14px;font-family:'DM Mono',monospace;}

/* FORM */
.add-btn{width:100%;background:var(--bg1);border:1px dashed var(--border);border-radius:14px;color:var(--muted);font-size:11px;letter-spacing:2px;padding:16px;cursor:pointer;font-family:'DM Mono',monospace;transition:border-color 0.2s;}
.form-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;}
.form-title{font-size:9px;letter-spacing:3px;color:var(--label-color);margin-bottom:16px;font-family:'DM Mono',monospace;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.field label{display:block;font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:6px;font-family:'DM Mono',monospace;}
.field input,.field select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus{border-color:var(--accent1);}
.form-btns{display:flex;gap:10px;}
.btn-save{flex:1;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border:none;border-radius:12px;padding:14px;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;font-family:'DM Mono',monospace;}
.btn-cancel{background:var(--bg2);color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;}

/* MONTH WRAP */
.month-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
.month-wrap::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(110,181,255,0.06),transparent);pointer-events:none;}
.month-name{font-size:22px;font-weight:700;letter-spacing:-0.8px;margin-bottom:2px;}
.month-sub{font-size:9px;letter-spacing:2px;color:var(--label-color);margin-bottom:16px;font-family:'DM Mono',monospace;}
.mw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mw-stat{background:var(--bg2);border-radius:14px;padding:14px;}
.msl{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:5px;font-family:'DM Mono',monospace;}
.msv{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.msu{font-size:10px;color:var(--label-color);font-weight:400;}
.pts-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.pts-row-label{font-size:8px;letter-spacing:2px;color:var(--label-color);font-family:'DM Mono',monospace;}
.pts-row-val{font-size:22px;font-weight:700;color:var(--gold);}
.wo-section-label{font-size:8px;letter-spacing:2px;color:var(--label-color);margin-bottom:8px;font-family:'DM Mono',monospace;}
.wo-split{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.wo-pill{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:9px;font-weight:500;letter-spacing:0.5px;display:flex;align-items:center;gap:4px;}
.wo-pill-count{color:var(--accent1);font-weight:700;font-family:'DM Mono',monospace;}
.best-worst{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bw-card{background:var(--bg2);border-radius:14px;padding:14px;}
.bw-label{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:6px;font-family:'DM Mono',monospace;}
.bw-val{font-size:18px;font-weight:700;letter-spacing:-0.5px;font-family:'DM Mono',monospace;}
.bw-date{font-size:9px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace;}

/* WEIGHT */
.weight-hero{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;}
.weight-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(176,136,249,0.08),transparent 60%);pointer-events:none;}
.weight-label{font-size:9px;letter-spacing:3px;color:var(--label-color);margin-bottom:8px;font-family:'DM Mono',monospace;}
.weight-num{font-size:64px;font-weight:700;letter-spacing:-3px;line-height:1;}
.weight-unit{font-size:16px;color:var(--muted);font-weight:400;}
.weight-change{font-size:13px;margin-top:8px;font-weight:500;}
.weight-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.wt-stat{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.wt-label{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:5px;font-family:'DM Mono',monospace;}
.wt-val{font-size:18px;font-weight:700;letter-spacing:-0.5px;}
.mini-chart{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.mini-chart svg{width:100%;display:block;}
.wlog{background:var(--bg1);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.wlog-head{display:grid;grid-template-columns:52px 1fr 80px;padding:10px 16px;border-bottom:1px solid var(--border);}
.wlog-head span{font-size:7px;letter-spacing:1px;color:var(--label-color);font-family:'DM Mono',monospace;}
.wlog-row{display:grid;grid-template-columns:52px 1fr 80px;padding:12px 16px;border-bottom:1px solid var(--row-border);align-items:center;}
.wlog-row:last-child{border-bottom:none;}
.wlog-row .wd{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;}
.wlog-row .ww{font-size:17px;font-weight:700;font-family:'DM Mono',monospace;}
.wlog-row .wc{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;}

/* COACH */
.coach-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);}
.coach-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;}
.coach-msg{max-width:88%;padding:12px 16px;border-radius:18px;font-size:13px;line-height:1.55;}
.coach-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-bottom-right-radius:4px;}
.coach-msg.ai{align-self:flex-start;background:var(--bg1);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px;}
.coach-msg.ai.loading{color:var(--muted);font-style:italic;}
.coach-input-row{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--border);}
.coach-input{flex:1;background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:13px 16px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:none;}
.coach-input:focus{border-color:var(--accent1);}
.coach-send{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:none;border-radius:14px;padding:13px 18px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;}
.coach-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.coach-chip{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:10px;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.5px;transition:border-color 0.2s;}
.coach-chip:active{border-color:var(--accent1);color:var(--text);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:26px;width:100%;max-width:340px;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
.modal-btns{display:flex;gap:10px;}
.modal-confirm{flex:1;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border:none;border-radius:12px;padding:13px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:'DM Mono',monospace;}
.modal-cancel{background:var(--bg2);color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:13px 16px;font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;overflow-y:auto;background:var(--bg);}
#splash.hidden{display:none;}
#splash::before{content:'';position:fixed;top:-80px;right:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(176,136,249,0.14) 0%,transparent 65%);pointer-events:none;}
#splash::after{content:'';position:fixed;bottom:60px;left:-60px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(110,181,255,0.10) 0%,transparent 65%);pointer-events:none;}
.splash-inner{padding:max(env(safe-area-inset-top),40px) 24px max(env(safe-area-inset-bottom),24px);}
.splash-greeting{font-size:9px;letter-spacing:4px;color:var(--label-color);margin-bottom:6px;font-family:'DM Mono',monospace;}
.splash-title{font-size:36px;font-weight:700;letter-spacing:-1.5px;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:4px;}
.splash-date{font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:28px;font-family:'DM Mono',monospace;}
.splash-stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px;}
.sp-stat{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:14px 12px;}
.sp-label{font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:4px;font-family:'DM Mono',monospace;}
.sp-val{font-size:20px;font-weight:700;letter-spacing:-0.5px;font-family:'DM Mono',monospace;}
.splash-divider{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.splash-divider-line{flex:1;height:1px;background:var(--border);}
.splash-divider-text{font-size:8px;letter-spacing:3px;color:var(--label-color);font-family:'DM Mono',monospace;white-space:nowrap;}
.splash-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.splash-field{margin-bottom:0;}
.splash-field label{display:block;font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:6px;font-family:'DM Mono',monospace;}
.splash-field input,.splash-field select{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;transition:border-color 0.2s;}
.splash-field input:focus,.splash-field select:focus{border-color:var(--accent1);}
.splash-full{margin-bottom:12px;}

      <div class="splash-field"><label>PROTEIN (g)</label><input id="s-prot" type="number" placeholder="180" inputmode="numeric"/></div>
      <div class="splash-field"><label>WEIGHT (lbs)</label><input id="s-weight" type="number" placeholder="183.0" inputmode="decimal" step="0.1"/></div>
    </div>
    <div class="splash-full">
      <label style="display:block;font-size:7px;letter-spacing:2px;color:var(--label-color);margin-bottom:6px;font-family:'DM Mono',monospace;">WORKOUT</label>
      <select id="s-workout" style="width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;">

        <option value="Arms">💪 Arms</option>
        <option value="Back">🏋️ Back</option>
        <option value="Legs">🦵 Legs</option>
        <option value="Shoulders">🏔️ Shoulders</option>
        <option value="Cardio">🚴 Cardio</option>
        <option value="Basketball">🏀 Basketball</option>

    </div>
    <button class="splash-log-btn" onclick="splashLog()">LOG TODAY</button>
    <a class="splash-skip" onclick="dismissSplash()">Skip — Go to Dashboard →</a>
  </div>
</div>

function loadData(){try{var d=localStorage.getItem(SK);return d?JSON.parse(d):defaultData;}catch(e){return defaultData;}}
function saveData(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
function loadWeights(){try{var d=localStorage.getItem(WK);return d?JSON.parse(d):[];}catch(e){return[];}}
function saveWeights(d){try{localStorage.setItem(WK,JSON.stringify(d));}catch(e){}}


function calcPoints(r){
  var def=r.burn-r.eat,pts=0;
  if(def>=500)pts+=3;else if(def>=300)pts+=2;else if(def>=1)pts+=1;
  if(r.protein>=140)pts+=2;else if(r.protein>=120)pts+=1;
  if(def>=300&&r.protein>=140)pts+=1;
  return Math.min(pts,6);
}
function totalPoints(){return loadData().reduce(function(s,r){return s+calcPoints(r);},0);}
function updateTopPts(){document.getElementById('top-pts').textContent=totalPoints();}
function defColor(d){return d>=300?'green':d>=0?'yellow':'red';}
function protColor(p){return p>=140?'green':p>=120?'yellow':'red';}
function fmt(n){return n>0?'+'+n.toLocaleString():n.toLocaleString();}
function parseDate(s){
  if(s.indexOf('-')>-1){var p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
  var p=s.split('/');return new Date(2026,parseInt(p[0])-1,parseInt(p[1]));
}
function toKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return toKey(new Date());}
function woOptions(sel){
  var out='<option value="">— Select —</option>';
  WORKOUT_OPTS.forEach(function(o){out+='<option value="'+o.v+'"'+(o.v===sel?' selected':'')+'>'+o.l+'</option>';});
  return out;
}

}

// ── SPLASH ──
function initSplash(){
  var data=loadData();
  var now=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('sp-date-lbl').textContent=days[now.getDay()].toUpperCase()+' · '+mons[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
  if(data.length){
    var avgDef=Math.round(data.reduce(function(s,r){return s+(r.burn-r.eat);},0)/data.length);
    var el=document.getElementById('sp-def');
    el.textContent=fmt(avgDef);
    el.className='sp-val '+(avgDef>=300?'green':avgDef>=0?'yellow':'red');
    document.getElementById('sp-pts').textContent=totalPoints();
    document.getElementById('sp-days').textContent=data.length;
  }
  var map={};data.forEach(function(r){map[r.date]=true;});
  if(map[todayKey()]){document.querySelector('.splash-log-btn').textContent='UPDATE TODAY';}
}

function splashLog(){
  var burn=parseInt(document.getElementById('s-burn').value);
  var eat=parseInt(document.getElementById('s-eat').value);
  var protein=parseInt(document.getElementById('s-prot').value);
  var workout=document.getElementById('s-workout').value;
  var notes=document.getElementById('s-notes').value.trim();
  var wv=parseFloat(document.getElementById('s-weight').value);
  if(isNaN(burn)||isNaN(eat)||isNaN(protein)){alert('Please fill in burn, eat, and protein.');return;}
  var data=loadData();
  var tk=todayKey();
  var entry={date:tk,burn:burn,eat:eat,protein:protein,workout:workout,notes:notes};
  var idx=data.findIndex(function(r){return r.date===tk;});
  if(idx>=0)data[idx]=entry;else data.push(entry);
  saveData(data);
  if(!isNaN(wv)&&wv>80){
    var weights=loadWeights();
    var wi=weights.findIndex(function(w){return w.date===tk;});
    if(wi>=0)weights[wi]={date:tk,weight:wv};else weights.push({date:tk,weight:wv});
    saveWeights(weights);
  }
  dismissSplash();
  showTab('log');
}
function dismissSplash(){document.getElementById('splash').classList.add('hidden');}

function showTab(tab){
  currentTab=tab;showingForm=false;editingIndex=null;

// ── WEEKLY REPORT ──
function weeklyReport(data){
  if(!data.length)return'';
  var sorted=data.slice().sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var rows=sorted.slice(0,7);
  var avgDef=Math.round(rows.reduce(function(s,r){return s+(r.burn-r.eat);},0)/rows.length);
  var avgProt=Math.round(rows.reduce(function(s,r){return s+r.protein;},0)/rows.length);
  var pts=rows.reduce(function(s,r){return s+calcPoints(r);},0);
  var trained=rows.filter(function(r){var w=(r.workout||'').toLowerCase();return w&&w!=='rest';}).length;
  var score=0;
  if(avgDef>=400)score+=3;else if(avgDef>=200)score+=2;else if(avgDef>=0)score+=1;
  if(avgProt>=160)score+=3;else if(avgProt>=140)score+=2;else if(avgProt>=120)score+=1;
  if(trained>=5)score+=2;else if(trained>=3)score+=1;
  var grade=score>=7?'A':score>=5?'B':score>=3?'C':'D';
  var msgs={A:'Excellent week 🔥',B:'Solid week 👍',C:'Room to grow 💪',D:'Reset and lock in ⚠️'};
  var de=parseDate(rows[0].date),ds=parseDate(rows[rows.length-1].date);
  var dr=(ds.getMonth()+1)+'/'+ds.getDate()+' – '+(de.getMonth()+1)+'/'+de.getDate();
  var allQ=[
    avgDef>=600?'🔥 Massive deficit — fat is burning.':null,
    avgDef>=300?'📉 Strong deficit. Body is in fat-burn mode.':null,
    avgProt>=180?'💪 Elite protein. Muscle fully protected.':null,
    avgProt>=160?'✅ Protein on point. Great work.':null,
    trained>=5?'🏋️ 5+ training days — elite consistency.':null,
    grade==='A'?'🏆 A-grade week. Top 10%.':null,
    '📊 A 500 cal deficit = ~1 lb lost per week.',
    '⚖️ Scale fluctuates 2-4 lbs daily — trust the trend.',
    '😴 Sleep is when muscles grow. Prioritize it.',
    '💧 Dehydration can mask hunger. Drink water first.',
    '🧬 Protein in a deficit preserves muscle mass.',
    '📉 Fat loss is not linear. Consistency wins.',
    '🔄 Rest days are recovery, not failure.',
    '⚡ Creatine + protein + deficit = optimal recomp.',
    '🧠 Discipline on bad days matters most.',
    '📸 Progress photos show what the scale hides.'
  ].filter(Boolean);
  var q=allQ.sort(function(){return Math.random()-0.5;}).slice(0,5).join('   ·   ');
  return '<div class="sec-head">WEEKLY REPORT</div>'+
    '<div class="report-card">'+
      '<div class="quote-track"><span class="quote-inner"><span class="quote-text">'+q+'</span></span></div>'+
      '<div class="rc-head">'+
        '<div><div class="rc-title">'+dr+'</div><div class="rc-sub">'+msgs[grade]+'</div></div>'+
        '<div class="rc-grade '+grade+'">'+grade+'</div>'+
      '</div>'+
      '<div class="rc-grid">'+
        '<div class="rc-stat"><div class="rsl">AVG DEFICIT</div><div class="rsv '+defColor(avgDef)+'">'+fmt(avgDef)+'<span style="font-size:10px;color:var(--label-color);"> cal</span></div></div>'+
        '<div class="rc-stat"><div class="rsl">AVG PROTEIN</div><div class="rsv '+protColor(avgProt)+'">'+avgProt+'<span style="font-size:10px;color:var(--label-color);">g</span></div></div>'+
        '<div class="rc-stat"><div class="rsl">POINTS</div><div class="rsv gold">'+pts+'<span style="font-size:10px;color:var(--label-color);"> pts</span></div></div>'+
        '<div class="rc-stat"><div class="rsl">TRAINED</div><div class="rsv">'+trained+'<span style="font-size:10px;color:var(--label-color);"> / '+rows.length+'</span></div></div>'+
      '</div>'+
    '</div>';
}

function saveEntry(){
  var dateStr=document.getElementById('f-date').value.trim();
  var burn=parseInt(document.getElementById('f-burn').value);
  var eat=parseInt(document.getElementById('f-eat').value);
  var protein=parseInt(document.getElementById('f-prot').value);

// ── WEIGHT ──
function renderWeight(){
  var weights=loadWeights().sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var html='<div class="sec-head">WEIGHT TRACKER</div>';
  if(weights.length){
    var latest=weights[0].weight;
    var oldest=weights[weights.length-1].weight;
    var change=+(latest-oldest).toFixed(1);
    var allW=weights.map(function(w){return w.weight;});
    var minW=Math.min.apply(null,allW);
    var maxW=Math.max.apply(null,allW);
    html+='<div class="weight-hero">'+
      '<div class="weight-label">CURRENT WEIGHT</div>'+
      '<div><span class="weight-num">'+latest+'</span><span class="weight-unit"> lbs</span></div>'+
      '<div class="weight-change '+(change<=0?'green':'red')+'">'+(change<=0?'▼ ':'▲ ')+Math.abs(change)+' lbs since start</div>'+
    '</div>'+
    '<div class="weight-stats">'+
      '<div class="wt-stat"><div class="wt-label">STARTING</div><div class="wt-val">'+oldest+'</div></div>'+
      '<div class="wt-stat"><div class="wt-label">LOWEST</div><div class="wt-val green">'+minW+'</div></div>'+
      '<div class="wt-stat"><div class="wt-label">HIGHEST</div><div class="wt-val">'+maxW+'</div></div>'+
    '</div>';
    if(weights.length>1){
      var pts=weights.slice().reverse();
      var vals=pts.map(function(w){return w.weight;});
      var mn=Math.min.apply(null,vals)-2,mx=Math.max.apply(null,vals)+2,range=mx-mn;
      var W=300,H=80,pad=10;
      var xf=function(i){return pad+(i/(vals.length-1))*(W-pad*2);};
      var yf=function(v){return H-pad-((v-mn)/range)*(H-pad*2);};
      var path=vals.map(function(v,i){return(i===0?'M':'L')+xf(i).toFixed(1)+','+yf(v).toFixed(1);}).join(' ');
      var dots=vals.filter(function(v,i){return i===0||i===vals.length-1;}).map(function(v,i){
        var xi=i===0?0:vals.length-1;
        return '<circle cx="'+xf(xi).toFixed(1)+'" cy="'+yf(v).toFixed(1)+'" r="3" fill="var(--green)"/>';
      }).join('');
      html+='<div class="mini-chart">'+
        '<div class="sec-head" style="margin-bottom:10px;">TREND</div>'+
        '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
          '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity="0.15"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>'+
          '<path d="'+path+' L'+xf(vals.length-1).toFixed(1)+','+H+' L'+xf(0).toFixed(1)+','+H+' Z" fill="url(#wg)"/>'+
          '<path d="'+path+'" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
          dots+
        '</svg>'+
      '</div>';
    }
  }
  html+='<div class="sec-head">LOG WEIGHT</div>'+
    '<div class="form-wrap" style="margin-bottom:16px;">'+
      '<div class="form-grid">'+
        '<div class="field"><label>DATE</label><input id="w-date" type="text" placeholder="'+(new Date().getMonth()+1)+'/'+new Date().getDate()+'/2026" inputmode="text"/></div>'+
        '<div class="field"><label>WEIGHT (lbs)</label><input id="w-val" type="number" placeholder="183.0" inputmode="decimal" step="0.1"/></div>'+
      '</div>'+
      '<div class="form-btns"><button class="btn-save" onclick="saveWeight()">LOG WEIGHT</button></div>'+
    '</div>';
  if(weights.length){
    html+='<div class="sec-head">HISTORY</div><div class="wlog"><div class="wlog-head"><span>DATE</span><span>WEIGHT</span><span>CHANGE</span></div>';
    weights.slice(0,30).forEach(function(w,i){
      var prev=weights[i+1];
      var change=prev?+(w.weight-prev.weight).toFixed(1):null;
      var d=parseDate(w.date),label=(d.getMonth()+1)+'/'+d.getDate();
      var chStr=change!==null?(change<=0?'<span class="green">▼'+Math.abs(change)+'</span>':'<span class="red">▲'+Math.abs(change)+'</span>'):'—';
      html+='<div class="wlog-row"><div class="wd">'+label+'</div><div class="ww '+(change!==null&&change<0?'green':'')+'">'+w.weight+'</div><div class="wc">'+chStr+'</div></div>';
    });
    html+='</div>';
  } else {
    html+='<div class="empty-state">No weight entries yet.<br>Log your first above.</div>';
  }
  document.getElementById('content').innerHTML=html;
}

function saveWeight(){
  var dateStr=document.getElementById('w-date').value.trim();
  var val=parseFloat(document.getElementById('w-val').value);
  if(!dateStr||isNaN(val)){alert('Fill in date and weight.');return;}
  var parts=dateStr.split('/'),dk;
  if(parts.length===3)dk=parts[2]+'-'+parts[0].padStart(2,'0')+'-'+parts[1].padStart(2,'0');
  else if(parts.length===2)dk='2026-'+parts[0].padStart(2,'0')+'-'+parts[1].padStart(2,'0');
  else{alert('Use M/D/YYYY');return;}
  var weights=loadWeights();
  var i=weights.findIndex(function(w){return w.date===dk;});
  if(i>=0)weights[i]={date:dk,weight:val};else weights.push({date:dk,weight:val});
  saveWeights(weights);renderWeight();
}

// ── TABLE ──
function renderTable(){
  var data=loadData();
  var sorted=data.map(function(r,i){var o=Object.assign({},r);o.origIdx=i;return o;}).sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var html='<div class="sec-head">'+sorted.length+' ENTRIES · ALL TIME</div>';
  html+='<div class="tbl"><div class="tbl-head"><span>DATE</span><span>BURN</span><span>EAT</span><span>DEFICIT</span><span>PROTEIN</span><span>WORKOUT</span><span>PTS</span></div>';
  sorted.forEach(function(r){
    var def=r.burn-r.eat,dc=defColor(def),pc=protColor(r.protein),pts=calcPoints(r);
    var d=parseDate(r.date),label=(d.getMonth()+1)+'/'+d.getDate();
    var wo=r.workout?r.workout.toUpperCase():'—';
    html+='<div class="tbl-row">'+
      '<div class="dt">'+label+'</div>'+
      '<div class="nm">'+r.burn.toLocaleString()+'</div>'+
      '<div class="nm">'+r.eat.toLocaleString()+'</div>'+
      '<div class="df '+dc+'">'+fmt(def)+'</div>'+
      '<div class="pr '+pc+'">'+r.protein+'g</div>'+
      '<div class="wo">'+wo+'</div>'+
      '<div class="px">+'+pts+'</div>'+
    '</div>';
  });
  html+='</div>';
  html+='<div class="legend"><span>● <span class="green">On track</span></span><span>● <span class="yellow">Borderline</span></span><span>● <span class="red">Off track</span></span></div>';
  document.getElementById('content').innerHTML=html;
}

// ── AI COACH ──
var coachHistory=[];
var coachRendered=false;

function buildContext(){
  var data=loadData();
  var weights=loadWeights().sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var sorted=data.slice().sort(function(a,b){return parseDate(b.date)-parseDate(a.date);});
  var recent=sorted.slice(0,7);
  var avgDef=data.length?Math.round(data.reduce(function(s,r){return s+(r.burn-r.eat);},0)/data.length):0;
  var avgProt=data.length?Math.round(data.reduce(function(s,r){return s+r.protein;},0)/data.length):0;
  var avgBurn=data.length?Math.round(data.reduce(function(s,r){return s+r.burn;},0)/data.length):0;
  var recentDef=recent.length?Math.round(recent.reduce(function(s,r){return s+(r.burn-r.eat);},0)/recent.length):0;
  var recentProt=recent.length?Math.round(recent.reduce(function(s,r){return s+r.protein;},0)/recent.length):0;
  var currentWeight=weights.length?weights[0].weight:null;
  var startWeight=weights.length?weights[weights.length-1].weight:null;
  var recentRows=recent.map(function(r){
    var d=parseDate(r.date);
    return (d.getMonth()+1)+'/'+d.getDate()+': burn='+r.burn+', eat='+r.eat+', deficit='+(r.burn-r.eat)+', protein='+r.protein+'g, workout='+(r.workout||'none');
  }).join('\n');
  return 'You are a personal fitness coach AI embedded inside the user\'s Deficit Tracker app. You have full access to their real data. Be direct, specific, and encouraging. Keep responses concise.\n\n'+
    'USER STATS:\n'+
    '- Total days logged: '+data.length+'\n'+
    '- All-time avg deficit: +'+avgDef+' cal/day\n'+
    '- All-time avg burn: '+avgBurn+' cal/day\n'+
    '- All-time avg protein: '+avgProt+'g/day\n'+
    '- Last 7 days avg deficit: +'+recentDef+' cal\n'+
    '- Last 7 days avg protein: '+recentProt+'g\n'+
    (currentWeight?'- Current weight: '+currentWeight+' lbs\n':'')+
    (startWeight&&currentWeight?'- Weight change: '+(+(currentWeight-startWeight).toFixed(1))+' lbs\n':'')+
    '- Protein goal: 140g+ green, 120-139g yellow\n'+
    '- Deficit goal: 300+ cal/day\n\n'+
    'LAST 7 ENTRIES:\n'+recentRows;
}

function renderCoach(){
  coachRendered=true;
  var chips=[
    'How\'s my progress this week?',
    'Am I on track to lose weight?',
    'What should I eat to hit protein today?',
    'Analyze my workout split',
    'What\'s my estimated fat loss so far?',
    'Where can I improve?'
  ];
  var chipHtml=chips.map(function(c){
    return '<div class="coach-chip" onclick="sendCoach(\''+c.replace(/'/g,"\\'")+'\')">'+ c+'</div>';
  }).join('');
  var msgsHtml=coachHistory.map(function(m){
    return '<div class="coach-msg '+m.role+'">'+m.content.replace(/\n/g,'<br>')+'</div>';
  }).join('');
  if(!coachHistory.length){
    msgsHtml='<div class="coach-msg ai">Hey! I\'m your fitness coach. I have access to all your deficit, protein, workout, and weight data. Ask me anything about your progress. 💪</div>';
  }
  var html='<div class="sec-head">AI COACH</div>'+
    '<div class="coach-chips">'+chipHtml+'</div>'+
    '<div class="coach-wrap">'+
      '<div class="coach-messages" id="coach-msgs">'+msgsHtml+'</div>'+
      '<div class="coach-input-row">'+
        '<input class="coach-input" id="coach-input" type="text" placeholder="Ask your coach..." inputmode="text" onkeydown="if(event.key===\'Enter\')sendCoachFromInput()"/>'+
        '<button class="coach-send" onclick="sendCoachFromInput()">↑</button>'+
      '</div>'+
    '</div>';
  document.getElementById('content').innerHTML=html;
  scrollCoach();
}

function scrollCoach(){
  setTimeout(function(){
    var el=document.getElementById('coach-msgs');
    if(el)el.scrollTop=el.scrollHeight;
  },50);
}

function sendCoachFromInput(){
  var input=document.getElementById('coach-input');
  if(!input||!input.value.trim())return;
  sendCoach(input.value.trim());
}

function sendCoach(msg){
  coachHistory.push({role:'user',content:msg});
  renderCoach();
  var msgsEl=document.getElementById('coach-msgs');
  if(msgsEl){
    var loading=document.createElement('div');
    loading.className='coach-msg ai loading';
    loading.id='coach-loading';
    loading.textContent='Thinking...';
    msgsEl.appendChild(loading);
    scrollCoach();
  }
  var systemPrompt=buildContext();
  var messages=coachHistory.map(function(m){return{role:m.role==='ai'?'assistant':m.role,content:m.content};});
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system:systemPrompt,
      messages:messages
    })
  }).then(function(r){return r.json();}).then(function(data){
    var reply='';
    if(data.content&&data.content.length){
      data.content.forEach(function(block){if(block.type==='text')reply+=block.text;});
    } else if(data.error){
      reply='Error: '+data.error.message;
    }
    coachHistory.push({role:'ai',content:reply});
    renderCoach();
  }).catch(function(e){
    coachHistory.push({role:'ai',content:'Sorry, something went wrong. Try again.'});
    renderCoach();
  });
}

// ── INIT ──
initTheme();
initSplash();
showTab('log');
</script>
